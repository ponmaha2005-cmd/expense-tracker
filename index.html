<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Expense Tracker</h1>
      <p class="total-label">Total spent</p>
      <p id="total" class="total">₹0</p>
    </header>

    <section class="card">
      <h2 id="form-title">Add expense</h2>
      <form id="expense-form" novalidate>
        <label>Title
          <input type="text" id="title" placeholder="e.g. Lunch" />
        </label>
        <label>Amount (₹)
          <input type="number" id="amount" placeholder="e.g. 120" min="0" step="0.01" />
        </label>
        <label>Category
          <select id="category">
            <option>Food</option>
            <option>Travel</option>
            <option>Bills</option>
            <option>Shopping</option>
            <option>Other</option>
          </select>
        </label>
        <label>Date
          <input type="date" id="date" />
        </label>
        <p id="error" class="error" role="alert"></p>
        <div class="buttons">
          <button type="submit" id="save-btn">Add expense</button>
          <button type="button" id="cancel-btn" class="secondary" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>Your expenses</h2>
        <select id="filter" aria-label="Filter by category">
          <option value="All">All categories</option>
          <option>Food</option>
          <option>Travel</option>
          <option>Bills</option>
          <option>Shopping</option>
          <option>Other</option>
        </select>
      </div>
      <ul id="list"></ul>
      <p id="empty" class="empty">No expenses yet. Add your first one above.</p>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
